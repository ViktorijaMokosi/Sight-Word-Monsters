<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Sight Word Monsters</title>
<link rel="stylesheet" href="style.css?v=4.4">
</head>
<body>
<main class="wrap">
<section id="choose" class="screen active">
<h1>👾 Sight Word Monsters</h1>
<p class="lead">Choose your funny monster!</p>
<details class="voiceSettings">
<summary>🔊 Žodžių balsas</summary>
<label for="wordVoice">Pasirink anglų kalbos balsą</label>
<select id="wordVoice"><option value="">Automatinis pasirinkimas</option></select>
<button id="testVoice" type="button" class="bigbtn">🔊 Paklausyti</button>
<p id="voiceHint">Pasirink balsą ir palygink tarimą.</p>
</details>
<div id="characters" class="grid"></div>
</section>

<section id="intro" class="screen"><button id="exitIntro" class="exitButton" type="button">← Rinktis kitą monstrą</button>
<div class="introbox">
<div id="introPic" class="heroPic"></div>
<h1 id="introName"></h1>
<div id="introText" class="bubble"></div>
<button id="hearIntro" class="bigbtn">🔊 Hear me again</button>
<button id="startGame" class="bigbtn">▶ Play!</button>
</div>
</section>

<section id="game" class="screen"><button id="exitGame" class="exitButton" type="button">← Rinktis kitą monstrą</button>
<h1>Listen & Find</h1>
<div class="gameTop">
<div id="gamePic" class="heroPic miniMonster"></div>
<button id="listen" class="bigbtn listen">🔊 Listen</button>
</div>
<p class="lead">Tap the word you hear.</p>
<div id="words" class="words"></div>
<div id="status" class="status"></div>
<div id="progress" class="progress"></div>
</section>

<section id="finish" class="screen">
  <div class="introbox">
    <div id="finishPic" class="heroPic"></div>
    <h1>🎉 Super!</h1>
    <div id="finishText" class="bubble">You found all 5 words!</div>
    <button id="playAgain" class="bigbtn">🔄 Play again</button>
  </div>
</section>
</main>

<script src="game.js?v=4.4"></script>
</body>
</html>
